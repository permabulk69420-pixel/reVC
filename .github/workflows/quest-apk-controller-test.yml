name: Quest APK controller test

on:
  push:
    branches:
      - agent/restore-sdl-controller-input
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x android/launcher/gradlew

      - name: Build debug APK
        working-directory: android/launcher
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reVC-Quest-controller-test
          path: android/launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# Triggered after workflow creation so the Quest build runs on this branch.
