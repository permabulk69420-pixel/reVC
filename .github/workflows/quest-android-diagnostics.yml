name: Quest Android diagnostics APK

on:
  push:
    branches:
      - quest-renderware-startup-diagnostics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build Quest diagnostics APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        working-directory: android/launcher
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: android/launcher
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: revc-renderware-diagnostics-release
          path: android/launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
